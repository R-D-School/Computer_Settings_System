<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sidebar Tabs</title>

<style>
/* ---------- BASE ---------- */
body {
  display: flex;
  font-family: Arial, sans-serif;
  margin: 0;
  height: 100vh;
}

button {
  min-height: 44px; /* touch friendly */
}

/* ---------- SIDEBAR ---------- */
.sidebar {
  width: 160px;
  background-color: #f0f0f0;
  padding: 10px;
  border-right: 1px solid #ccc;
}

.sidebar button {
  display: block;
  width: 100%;
  margin-bottom: 6px;
  padding: 10px;
  border: none;
  background-color: #eee;
  cursor: pointer;
  text-align: left;
}

.sidebar button.active {
  background-color: #ddd;
  font-weight: bold;
}

/* ---------- CONTENT ---------- */
.content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

/* ---------- BOTTLE ---------- */
#bottle {
  width: 50px;
  height: 300px;
  border: 2px solid black;
  position: relative;
  background: lightgray;
  overflow: hidden;
}

#fill {
  width: 100%;
  height: 60%;
  background: blue;
  position: absolute;
  bottom: 0;
}

#percentText {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 50%;
  transform: translateY(-50%);
  font-weight: bold;
  color: white;
}

/* ---------- SHAPES ---------- */
.shape {
  width: 100px;
  height: 100px;
  margin: 10px;
  display: inline-block;
  border: 2px solid #000;
  cursor: pointer;
  background: gray;
}

#eye {
  width: 50px;
  height: 30px;
  clip-path: ellipse(50% 50% at 50% 50%);
}

/* ---------- DRAG BOX ---------- */
#dragBox {
  width: 150px;
  height: 100px;
  background-color: #4CAF50;
  color: white;
  padding: 10px;
  position: absolute;
  top: 200px;
  left: 200px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}

/* ---------- MOBILE ---------- */
@media (max-width: 768px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
  }

  .sidebar button {
    flex: 1 1 48%;
  }
}
</style>
</head>

<body>

<div class="sidebar">
  <button onclick="showTab('home')" class="active">Home</button>
  <button onclick="showTab('system')">System</button>
  <button onclick="showTab('network')">Network</button>
  <button onclick="showTab('about')">About</button>
</div>

<div class="content">
  <div id="home" class="tab-content active">
    <h2>Home</h2>
    <div id="dragBox">Drag me!</div>
  </div>

  <div id="system" class="tab-content">
    <h2>System</h2>

    <div id="bottle">
      <div id="fill"></div>
      <div id="percentText">60%</div>
    </div>

    <div id="eye" class="shape"></div>
    <button id="blueButton">Make Blue</button>
    <button id="redButton">Make Red</button>
  </div>

  <div id="network" class="tab-content">
    <h2>Network</h2>
    <input type="text" placeholder="Wi-Fi name">
  </div>

  <div id="about" class="tab-content">
    <h2>About</h2>
    <p>Version info</p>
  </div>
</div>

<script>
/* ---------- TABS ---------- */
function showTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
  document.querySelectorAll('.sidebar button').forEach(btn => btn.classList.remove('active'));

  document.getElementById(tabId).classList.add('active');
  document.querySelector(`.sidebar button[onclick="showTab('${tabId}')"]`).classList.add('active');
}

/* ---------- COLOR BUTTONS ---------- */
const eye = document.getElementById('eye');

blueButton.onclick = () => eye.style.background = 'blue';
redButton.onclick = () => eye.style.background = 'red';

/* ---------- DRAG (MOUSE + TOUCH) ---------- */
const box = document.getElementById('dragBox');
let startX, startY, dragging = false;

function startDrag(x, y) {
  dragging = true;
  startX = x - box.offsetLeft;
  startY = y - box.offsetTop;
}

function moveDrag(x, y) {
  if (!dragging) return;
  box.style.left = `${x - startX}px`;
  box.style.top = `${y - startY}px`;
}

box.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
document.addEventListener('mouseup', () => dragging = false);

box.addEventListener('touchstart', e => {
  const t = e.touches[0];
  startDrag(t.clientX, t.clientY);
});

document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  moveDrag(t.clientX, t.clientY);
});

document.addEventListener('touchend', () => dragging = false);
</script>

</body>
</html>
