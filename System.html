<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tabs-in-Tabs</title>
<link rel="stylesheet" type="text/css" href="System.css">

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔴 Replace with your Firebase project info
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT",
};

export const app = initializeApp(firebaseConfig);
export const db = getDatabase(app);
</script>

</head>
<body>

<!-- ALL TABS -->
<div class="app">
  <div class="sidebar">
    <button onclick="navigateTo('home')">Home</button>
    <button onclick="navigateTo('system')">System</button>
    <button onclick="navigateTo('network')">Network</button>
    <button onclick="navigateTo('about')">About</button>
  </div>

  <div class="content">
    <div id="breadcrumbs"></div>

    <!-- HOME -->
    <section id="home" class="panel active" data-label="Home">
      <h2>Home</h2>
      <p class="muted">Main dashboard.</p>

      <!-- Shared Dropdown -->
      <div style="margin-top:12px;">
        <label for="sharedDropdown">Shared dropdown (1–4):</label>
        <select id="sharedDropdown">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>

      <!-- Water Tracker -->
      <div style="margin-top:12px;">
        <label for="startTimeInput">Reference start time (when bottle was full):</label>
        <input type="datetime-local" id="startTimeInput" value="2025-09-30T00:00">
        <button id="applyStartTime">Apply start time (reset to full at this moment)</button>
      </div>

      <div id="bottle" style="margin-top:12px; width:100px; height:200px; border:1px solid #000; position:relative;">
        <div id="fill" style="position:absolute; bottom:0; width:100%; background:lightblue;"></div>
        <div id="percentText" style="position:absolute; top:0; width:100%; text-align:center;"></div>
      </div>

      <div style="margin-top:12px;">
        <label for="waterInput">Add Water (mL):</label>
        <input type="number" id="waterInput" min="0" value="236.5">
        <button id="addWater">Add Water</button>
      </div>

      <div id="Name_current"></div>
      <div id="Name">
        <span class="tooltip" data-tooltip="Google-style info">Hover over me</span>
      </div>
      <div id="ClockT">Model R start up was <span id="StartClock"></span> ago</div>
      <div id="ClockT">Last Updated <span id="AClock"></span> ago</div>
    </section>

    <!-- Other tabs could go here -->
  </div>
</div>

<script type="module">
import { db } from './firebase-config.js'; // or inline Firebase as above
import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* --CONFIG-- */
const dailyGoal = 3000; 
const minutesPerDay = 1; 
const decrementPerMinute = dailyGoal / minutesPerDay;
const saveIntervalMs = 1000;

/* --DOM-- */
const sharedDropdown = document.getElementById('sharedDropdown');
const startTimeInput = document.getElementById('startTimeInput');
const applyStartBtn = document.getElementById('applyStartTime');
const addWaterBtn = document.getElementById('addWater');
const waterInput = document.getElementById('waterInput');
const fill = document.getElementById('fill');
const percentText = document.getElementById('percentText');

/* --STATE-- */
let totalConsumed = 0; 
let lastTimestamp = new Date().toISOString(); 

/* --Firebase refs-- */
const waterRef = ref(db, "sharedWater");
const dropdownRef = ref(db, "sharedDropdown/value");

/* --Dropdown sync-- */
sharedDropdown.addEventListener("change", () => {
  set(dropdownRef, sharedDropdown.value);
});
onValue(dropdownRef, snapshot => {
  const val = snapshot.val();
  if(val !== null && val !== sharedDropdown.value){
    sharedDropdown.value = val;
  }
});

/* --Helpers-- */
function nowISO() { return new Date().toISOString(); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* --UI Update-- */
function updateUI(){
  const percent = clamp((totalConsumed / dailyGoal)*100,0,100);
  fill.style.height = percent + '%';
  percentText.textContent = Math.round(percent) + '%';
}

/* --Water operations-- */
function applyElapsedDecay(){
  const now = new Date();
  const elapsedMinutes = (now - new Date(lastTimestamp))/60000;
  const decayMl = elapsedMinutes * decrementPerMinute;
  totalConsumed = clamp(totalConsumed - decayMl,0,dailyGoal);
  lastTimestamp = nowISO();
}

function addWater(amountMl){
  applyElapsedDecay();
  totalConsumed += amountMl;
  totalConsumed = clamp(totalConsumed,0,dailyGoal);
  lastTimestamp = nowISO();
  set(waterRef, { totalConsumed, lastTimestamp });
  updateUI();
}

function applyStartTimeFromInput(){
  const d = new Date(startTimeInput.value);
  totalConsumed = dailyGoal;
  lastTimestamp = d.toISOString();
  set(waterRef, { totalConsumed, lastTimestamp });
  applyElapsedDecay();
  updateUI();
}

/* --Firebase water sync-- */
onValue(waterRef, snapshot=>{
  const val = snapshot.val();
  if(val){
    totalConsumed = val.totalConsumed;
    lastTimestamp = val.lastTimestamp;
    updateUI();
  }
});

/* --Events-- */
addWaterBtn.addEventListener('click', ()=>{
  const amount = parseFloat(waterInput.value) || 0;
  if(amount>0) addWater(amount);
  waterInput.value = 236.5;
});
applyStartBtn.addEventListener('click', applyStartTimeFromInput);

/* --Decay tick-- */
setInterval(()=>{
  applyElapsedDecay();
  updateUI();
  set(waterRef, { totalConsumed, lastTimestamp });
}, saveIntervalMs);

/* --Tabs & breadcrumbs-- */
function navigateTo(id){
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  const panel = document.getElementById(id);
  if(!panel) return;
  panel.classList.add("active");
  updateBreadcrumbs(id);
  updateActiveButtons(id);
}

function updateBreadcrumbs(id){
  const breadcrumbs = document.getElementById("breadcrumbs");
  breadcrumbs.innerHTML = "";
  let path = [];
  let cur = document.getElementById(id);
  while (cur) {
    path.unshift({ id: cur.id, label: cur.dataset.label });
    cur = cur.dataset.parent ? document.getElementById(cur.dataset.parent) : null;
  }
  path.forEach((item,i)=>{
    const span = document.createElement("span");
    span.textContent = item.label;
    if(i<path.length-1){
      span.classList.add("clickable");
      span.onclick = ()=>navigateTo(item.id);
    }
    breadcrumbs.appendChild(span);
    if(i<path.length-1) breadcrumbs.appendChild(document.createTextNode(" "));
  });
}

function updateActiveButtons(id){
  document.querySelectorAll(".sidebar button").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(`[onclick="navigateTo('${id}')"]`).forEach(b=>b.classList.add("active"));
}

navigateTo("home");

/* --Clock-- */
const startDate = new Date("2003-06-02T01:00:00"); 
const UpdateDate = new Date("2016-12-30T00:00:00");
function Clock() {
  document.getElementById("StartClock").textContent = formatDiff(startDate);
  document.getElementById("AClock").textContent = formatDiff(UpdateDate);
}
setInterval(Clock,1000);
Clock();

function formatDiff(startDate){
  let diff = Math.floor((new Date() - startDate)/1000);
  const years = Math.floor(diff / (365*24*60*60));
  diff -= years*365*24*60*60;
  const months = Math.floor(diff/(30*24*60*60));
  diff -= months*30*24*60*60;
  const days = Math.floor(diff/(24*60*60));
  diff -= days*24*60*60;
  const hours = Math.floor(diff/(60*60));
  diff -= hours*60*60;
  const minutes = Math.floor(diff/60);
  diff -= minutes*60;
  const seconds = diff;
  return `${years}y ${months}mo ${days}d ${hours}h ${minutes}m ${seconds}s`;
}
</script>

</body>
</html>
