<section id="home" class="panel active" data-label="Home">
  <h2>Home</h2>
  <p class="muted">Main dashboard.</p>

  <!-- Shared Dropdown -->
  <div style="margin-top:12px;">
    <label for="sharedDropdown">Shared dropdown (1–4):</label>
    <select id="sharedDropdown">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <!-- Water Tracker -->
  <div style="margin-top:12px;">
    <label for="startTimeInput">Reference start time (when bottle was full):</label>
    <input type="datetime-local" id="startTimeInput" value="2025-09-30T00:00">
    <button id="applyStartTime">Apply start time (reset to full at this moment)</button>
  </div>

  <div id="bottle" style="margin-top:12px; width:100px; height:200px; border:1px solid #000; position:relative;">
    <div id="fill" style="position:absolute; bottom:0; width:100%; background:lightblue;"></div>
    <div id="percentText" style="position:absolute; top:0; width:100%; text-align:center;"></div>
  </div>

  <div style="margin-top:12px;">
    <label for="waterInput">Add Water (mL):</label>
    <input type="number" id="waterInput" min="0" value="236.5">
    <button id="addWater">Add Water</button>
  </div>

  <div id="Name_current"></div>
  <div id="Name">
    <span class="tooltip" data-tooltip="Google-style info">Hover over me</span>
  </div>
  <div id="ClockT">Model R start up was <span id="StartClock"></span> ago</div>
  <div id="ClockT">Last Updated <span id="AClock"></span> ago</div>
</section>
<script type="module">
import { db } from './firebase-config.js'; // if you separated Firebase, or inline as above
import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* --CONFIG-- */
const dailyGoal = 3000; // mL
const minutesPerDay = 1; // for demo; change to 1440 in real life
const decrementPerMinute = dailyGoal / minutesPerDay;
const saveIntervalMs = 1000; // tick every second

/* --DOM-- */
const sharedDropdown = document.getElementById('sharedDropdown');
const startTimeInput = document.getElementById('startTimeInput');
const applyStartBtn = document.getElementById('applyStartTime');
const addWaterBtn = document.getElementById('addWater');
const waterInput = document.getElementById('waterInput');
const fill = document.getElementById('fill');
const percentText = document.getElementById('percentText');

/* --STATE-- */
let totalConsumed = 0; 
let lastTimestamp = new Date().toISOString(); 

/* --Firebase refs-- */
const waterRef = ref(db, "sharedWater");
const dropdownRef = ref(db, "sharedDropdown/value");

/* --Dropdown sync-- */
sharedDropdown.addEventListener("change", () => {
  set(dropdownRef, sharedDropdown.value);
});
onValue(dropdownRef, snapshot => {
  const val = snapshot.val();
  if(val !== null && val !== sharedDropdown.value){
    sharedDropdown.value = val;
  }
});

/* --Helpers-- */
function nowISO() { return new Date().toISOString(); }
function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* --UI Update-- */
function updateUI(){
  const percent = clamp((totalConsumed / dailyGoal)*100,0,100);
  fill.style.height = percent + '%';
  percentText.textContent = Math.round(percent) + '%';
}

/* --Water operations-- */
function applyElapsedDecay(){
  const now = new Date();
  const elapsedMinutes = (now - new Date(lastTimestamp))/60000;
  const decayMl = elapsedMinutes * decrementPerMinute;
  totalConsumed = clamp(totalConsumed - decayMl,0,dailyGoal);
  lastTimestamp = nowISO();
}

function addWater(amountMl){
  applyElapsedDecay();
  totalConsumed += amountMl;
  totalConsumed = clamp(totalConsumed,0,dailyGoal);
  lastTimestamp = nowISO();
  set(waterRef, { totalConsumed, lastTimestamp });
  updateUI();
}

function applyStartTimeFromInput(){
  const d = new Date(startTimeInput.value);
  totalConsumed = dailyGoal;
  lastTimestamp = d.toISOString();
  set(waterRef, { totalConsumed, lastTimestamp });
  applyElapsedDecay();
  updateUI();
}

/* --Firebase water sync-- */
onValue(waterRef, snapshot=>{
  const val = snapshot.val();
  if(val){
    totalConsumed = val.totalConsumed;
    lastTimestamp = val.lastTimestamp;
    updateUI();
  }
});

/* --Events-- */
addWaterBtn.addEventListener('click', ()=>{
  const amount = parseFloat(waterInput.value) || 0;
  if(amount>0) addWater(amount);
  waterInput.value = 236.5;
});
applyStartBtn.addEventListener('click', applyStartTimeFromInput);

/* --Decay tick-- */
setInterval(()=>{
  applyElapsedDecay();
  updateUI();
  set(waterRef, { totalConsumed, lastTimestamp });
}, saveIntervalMs);
</script>
